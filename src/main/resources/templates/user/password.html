<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경 - HanSung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-bottom: 80px; }
        .navbar { background: linear-gradient(90deg, #1a1a2e, #0f3460); }
        .navbar-brand { font-weight: 800; color: #e94560 !important; font-size: 1.4rem; }
        .form-card { border: none; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
        .page-header { border-left: 4px solid #e94560; padding-left: 1rem; }
        .btn-change { background: #e94560; border-color: #e94560; }
        .btn-change:hover { background: #c73652; border-color: #c73652; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">HanSung</a>
        <div class="ms-auto">
            <a th:href="@{/home}" class="btn btn-outline-light btn-sm px-3">홈으로</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="page-header mb-4">
        <h4 class="fw-bold mb-0">비밀번호 변경</h4>
        <small class="text-muted">현재 비밀번호 확인 후 새 비밀번호로 변경합니다.</small>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card form-card">
                <div class="card-body p-5">
                    <form th:action="@{/user/password}" th:object="${passwordChangeDto}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">현재 비밀번호</label>
                            <input type="password" th:field="*{currentPassword}" class="form-control form-control-lg"
                                   th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{currentPassword}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">새 비밀번호</label>
                            <input type="password" th:field="*{newPassword}" class="form-control form-control-lg"
                                   th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{newPassword}"></div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">새 비밀번호 확인</label>
                            <input type="password" th:field="*{confirmPassword}" class="form-control form-control-lg"
                                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-change text-white btn-lg flex-grow-1 fw-semibold">
                                비밀번호 변경
                            </button>
                            <a th:href="@{/home}" class="btn btn-outline-secondary btn-lg px-4">취소</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="bg-light border-top py-3 position-fixed bottom-0 start-0 w-100">
    <div class="container text-center text-muted small">
        <p class="mb-0">
            실습 수행 일시: <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd HH:mm:ss')}"></span>
            │ 학번: <span>2391042</span>
            │ 성명: <span>조윤지</span>
        </p>
    </div>
</footer>
</body>
</html>
