<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>상품 수정 - HanSung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-bottom: 80px; }
        .navbar { background: linear-gradient(90deg, #1a1a2e, #0f3460); }
        .navbar-brand { font-weight: 800; color: #e94560 !important; font-size: 1.4rem; }
        .form-card { border: none; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
        .page-header { border-left: 4px solid #e94560; padding-left: 1rem; }
        .btn-update { background: #e94560; border-color: #e94560; }
        .btn-update:hover { background: #c73652; border-color: #c73652; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">HanSung</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/home}">홈</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/products}">상품 목록</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/products/add}">상품 등록</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/dashboard}">관리자</a></li>
            </ul>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button class="btn btn-outline-light btn-sm px-3">로그아웃</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="page-header mb-4">
        <h4 class="fw-bold mb-0">상품 수정</h4>
        <small class="text-muted">상품 정보를 수정해주세요.</small>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card form-card">
                <div class="card-body p-5">
                    <form th:action="@{/products/{id}/edit(id=${productId})}"
                          th:object="${productDto}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">상품명 <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{name}" class="form-control form-control-lg"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">가격 (원) <span class="text-danger">*</span></label>
                            <input type="number" th:field="*{price}" class="form-control form-control-lg"
                                   th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{price}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">재고 수량 <span class="text-danger">*</span></label>
                            <input type="number" th:field="*{stock}" class="form-control form-control-lg"
                                   th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{stock}"></div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">상품 설명</label>
                            <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-update text-white btn-lg flex-grow-1 fw-semibold">수정</button>
                            <a th:href="@{/products}" class="btn btn-outline-secondary btn-lg px-4">취소</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="bg-light border-top py-3 position-fixed bottom-0 start-0 w-100">
    <div class="container text-center text-muted small">
        <p class="mb-0">
            실습 수행 일시: <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd HH:mm:ss')}"></span>
            │ 학번: <span>2391042</span>
            │ 성명: <span>조윤지</span>
        </p>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
